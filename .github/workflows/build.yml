name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build .geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: latest
          build-config: Release
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: magmituber.ai-structure-decorator-${{ matrix.target }}-0.6.0
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
