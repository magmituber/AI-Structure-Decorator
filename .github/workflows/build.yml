name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build .geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: magmituber.ai-structure-decorator-Android64-0.8.0
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
